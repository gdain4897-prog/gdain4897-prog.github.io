<style>
/* Layout: 얇은 상단 도구줄 / 왼쪽 부품 검색 | 가운데 기판 | 오른쪽 탭(속성·점검·부품표) */
:root{

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111315; --panel:#181b1e; --soft:#212529; --line:#2b3035; --fg:#e7eaed; --muted:#8d959d;
  --accent:#5b93ef; --accent-fg:#0d1420; --ok:#5cc189; --bad:#ef6b5c; --warn:#e5ad4a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111315; --panel:#181b1e; --soft:#212529; --line:#2b3035; --fg:#e7eaed; --muted:#8d959d;
  --accent:#5b93ef; --accent-fg:#0d1420; --ok:#5cc189; --bad:#ef6b5c; --warn:#e5ad4a; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:13px/1.45 var(--sans)}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;gap:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.title{font-weight:600;font-size:14px;margin-right:6px}
.seg{display:inline-flex;background:var(--soft);border-radius:8px;padding:2px;gap:2px}
.b{height:30px;display:inline-flex;align-items:center;gap:6px;padding:0 10px;border-radius:6px;border:0;background:transparent;cursor:pointer;white-space:nowrap;color:var(--fg)}
.b:hover{background:var(--soft)}
.seg .b:hover{background:color-mix(in srgb,var(--panel) 60%,transparent)}
.seg .b[aria-pressed="true"]{background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:600}
.b.primary{background:var(--accent);color:var(--accent-fg)}
.b.primary:hover{filter:brightness(1.05)}
.b.danger{color:var(--bad)}
.b:disabled{opacity:.4;cursor:default}
.b:focus-visible,.sw:focus-visible,input:focus-visible,select:focus-visible,.res:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.spacer{flex:1}
.vsep{width:1px;height:20px;background:var(--line)}
.sws{display:inline-flex;align-items:center;gap:5px;padding:0 4px}
.sws span{color:var(--muted);margin-right:2px}
.sw{width:18px;height:18px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.sw.auto{background:conic-gradient(#d6453d 0 50%,#2f6fd6 0);}

.main{display:grid;grid-template-columns:240px minmax(0,1fr) 280px;gap:8px;min-height:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.search{padding:10px;border-bottom:1px solid var(--line)}
.search input{width:100%;height:34px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--soft)}
.search input:focus{background:var(--panel)}
.scroll{overflow:auto;min-height:0;flex:1;padding:6px 6px 10px}
.gh{font-size:11px;font-weight:600;color:var(--muted);padding:10px 8px 4px}

.res:hover,.res.hl{background:var(--soft)}
.res[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.res small{color:var(--muted);font-size:11.5px;text-align:right}
.libtabs{display:flex;gap:2px;margin-top:8px;background:var(--soft);border-radius:8px;padding:2px}

.libtabs button:focus-visible{outline:2px solid var(--accent)}
.gh2{font-size:11px;color:var(--muted);padding:6px 8px 2px;border-top:1px dashed var(--line);margin-top:4px}

.recent{display:flex;flex-wrap:wrap;gap:4px;padding:2px 8px 4px}

.empty{color:var(--muted);font-size:12px;padding:6px 8px}
.stage{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);min-height:0}

  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 6px 5px 12px;box-shadow:0 4px 14px rgba(0,0,0,.08);max-width:calc(100% - 20px)}

.status span{background:color-mix(in srgb,var(--panel) 80%,transparent);padding:1px 6px;border-radius:4px}
.status span:empty{display:none}
.sizetag{position:absolute;right:10px;bottom:8px;font:12px var(--mono);color:var(--muted);background:color-mix(in srgb,var(--panel) 80%,transparent);padding:1px 6px;border-radius:4px;pointer-events:none}
.sample{position:absolute;top:10px;left:10px;font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 8px}
.tabs{display:flex;gap:2px;padding:6px;border-bottom:1px solid var(--line)}
.tab{flex:1;height:30px;border:0;border-radius:6px;background:none;cursor:pointer;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--soft);color:var(--fg);font-weight:600}
.tab em{font-style:normal;font-size:11px;background:var(--bad);color:#fff;border-radius:8px;padding:0 5px;margin-left:4px}
.pane{padding:12px}
h4{margin:0 0 10px;font-size:13px;font-weight:600}
.row{display:grid;grid-template-columns:64px 1fr;align-items:center;gap:8px;margin-bottom:8px}
.row label{color:var(--muted);font-size:12px}
.row input,.row select{width:100%;height:30px;border:1px solid var(--line);border-radius:6px;padding:0 8px;background:var(--soft)}
.meta{font:12px var(--mono);color:var(--muted);margin:2px 0 10px}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.btns .b{border:1px solid var(--line)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{text-align:left;padding:4px 5px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--muted);font-size:11px}
td.m{font-family:var(--mono);white-space:nowrap;font-variant-numeric:tabular-nums}
.nv{color:#d6453d;font-weight:600}.ng{color:#2f6fd6;font-weight:600}.nn{color:var(--muted)}
ul.chk{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
ul.chk li{display:grid;grid-template-columns:12px 1fr;gap:8px;font-size:12.5px}
ul.chk li::before{content:"";width:8px;height:8px;border-radius:50%;margin-top:5px}
li.ok::before{background:var(--ok)}li.bad::before{background:var(--bad)}li.warn::before{background:var(--warn)}li.info::before{border:1.5px solid var(--muted)}
.bom tr{cursor:pointer}.bom tr:hover td{background:var(--soft)}
.bom td.done{color:var(--ok);font-weight:600}.bom td.over{color:var(--warn);font-weight:600}
#task{width:100%;height:30px;border:1px solid var(--line);border-radius:6px;padding:0 8px;background:var(--soft);margin-bottom:10px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:12.5px;align-items:baseline}
kbd{font:11px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--muted);justify-self:start;white-space:nowrap}
.note{font-size:12px;color:var(--muted);margin:10px 0 0}
#toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--panel);padding:7px 14px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .15s;z-index:60}
#toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(10,12,14,.4);display:grid;place-items:center;z-index:50;padding:16px}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(560px,100%);max-height:calc(100% - 16px);overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.dlg h2{margin:0;font-size:16px;font-weight:600}
.dlg.wide{width:min(880px,100%)}
.tkTbl{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:8px}
.tkTbl table{font-size:12.5px}.tkTbl th{position:sticky;top:0;background:var(--panel);z-index:1}
.tkTbl select,.tkTbl input{width:100%;height:28px;border:1px solid var(--line);border-radius:5px;background:var(--soft);padding:0 6px;min-width:0}
.tkTbl td:nth-child(1){min-width:180px}.tkTbl td:nth-child(2){width:96px}.tkTbl td:nth-child(3){width:64px}.tkTbl td:nth-child(4){width:36px}
.tkTbl .b{height:28px;padding:0 8px}
.help{display:grid;grid-template-columns:190px minmax(0,1fr);gap:14px;min-height:0}
.help nav{display:flex;flex-direction:column;gap:1px;border-right:1px solid var(--line);padding-right:10px;max-height:62vh;overflow:auto}
.help nav input{height:30px;border:1px solid var(--line);border-radius:6px;padding:0 8px;background:var(--soft);margin-bottom:6px}
.help nav button{text-align:left;border:0;background:none;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:12.5px;color:var(--fg)}
.help nav button:hover{background:var(--soft)}.help nav button[aria-current="true"]{background:color-mix(in srgb,var(--accent) 14%,transparent);font-weight:600}
.help article{max-height:62vh;overflow:auto;font-size:13.5px;line-height:1.65;padding-right:4px}
.help article h3{font-size:15px;margin:0 0 10px;color:var(--fg);letter-spacing:0;text-transform:none;font-family:var(--sans)}
.help article h4{font-size:13px;margin:14px 0 6px}
.help article p{margin:0 0 8px}.help article ul{margin:0 0 8px;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.help article code{font:12px var(--mono);background:var(--soft);padding:1px 5px;border-radius:4px}
.help article pre{font:12px/1.5 var(--mono);background:var(--soft);padding:8px 10px;border-radius:8px;overflow:auto;margin:0 0 8px}
.help .fx{display:grid;grid-template-columns:max-content 1fr;gap:6px 12px;align-items:baseline;margin-bottom:8px}
.help .fx>b{white-space:nowrap}
.help .tip{border-left:3px solid var(--accent);background:color-mix(in srgb,var(--accent) 7%,transparent);padding:6px 10px;border-radius:0 6px 6px 0;margin:8px 0}
.qh{width:20px;height:20px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--muted);font:600 11px var(--sans);cursor:pointer;display:inline-grid;place-items:center;padding:0;flex:none}
.qh:hover{color:var(--accent);border-color:var(--accent)}
@media (max-width:700px){.help{grid-template-columns:1fr}.help nav{border-right:0;border-bottom:1px solid var(--line);padding:0 0 8px;max-height:none;flex-direction:row;flex-wrap:wrap}.help nav input{width:100%}}
.tour{font-size:13.5px;line-height:1.6}.tour p{margin:0 0 8px}.tour ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.tour code{font:12px var(--mono);background:var(--soft);padding:1px 5px;border-radius:4px}
.tourmap{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0 10px}.tourmap div{border:1px solid var(--line);border-radius:8px;padding:8px;font-size:12.5px;background:var(--soft)}
.dots{display:flex;gap:6px;justify-content:center}.dots span{width:7px;height:7px;border-radius:50%;background:var(--line)}.dots span.on{background:var(--accent)}
@media (max-width:520px){.tourmap{grid-template-columns:1fr}}
.dlg h5{margin:0 0 8px;font-size:12px;color:var(--muted);font-weight:600}
.dlg textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:8px;background:var(--soft);font:12px var(--mono);padding:8px;resize:vertical}
.dlg .acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.dlg .acts .b{border:1px solid var(--line)}.dlg .acts .b.primary{border-color:var(--accent)}
.fieldrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fieldrow input[type=number]{width:72px;height:30px;border:1px solid var(--line);border-radius:6px;padding:0 8px;background:var(--soft);font-family:var(--mono)}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.th{border:1px solid var(--line);border-radius:8px;padding:6px;background:var(--panel);cursor:pointer;text-align:left}
.th[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.th .pv{height:42px;border-radius:5px;margin-bottom:5px;position:relative;overflow:hidden}
.th span{font-size:12px}
.colors{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.colors label{display:flex;align-items:center;gap:8px;font-size:12.5px}
.colors input[type=color]{width:34px;height:26px;border:1px solid var(--line);border-radius:6px;padding:0;background:none;cursor:pointer}
.stage{display:grid;grid-template-rows:var(--schH,42%) 7px minmax(0,1fr);background:var(--panel)}
.stage.schmin{grid-template-rows:auto minmax(0,1fr)}
.stage.schmin .sch-b,.stage.schmin .split{display:none}
.sch{display:flex;flex-direction:column;min-height:0}
.sch-h{display:flex;align-items:center;gap:4px;flex-wrap:wrap;padding:4px 6px 4px 12px;border-bottom:1px solid var(--line)}
.sch-h>b{font-weight:600;margin-right:6px}
.sch-h .b{height:26px;padding:0 8px;font-size:12px}
.sch-h .seg .b{height:24px}
.sch-sum{font:12px var(--mono);display:inline-flex;gap:10px;margin-right:6px}
.c-ok{color:var(--ok)}.c-bad{color:var(--bad)}.c-todo{color:var(--muted)}

.schnote .b{height:26px;border:1px solid var(--line);font-size:12px}

function tryPlace(){if(!hover)return;const g=ghost();if(!valid(g,-1))return toast(pinsW(g).some(q=>!inB(q.x,q.y))?'기판 밖으로 나가요':'다른 부품 핀과 겹쳐요');
  pushUndo();g.id=nid();S.parts.push(g);S.sample=false;if(!place.ref)addRecent(place);const fixed=!!place.ref;changed();if(fixed){setMode('select');sel={type:'part',id:g.id};renderPane();req()}}
function wireClick(h){
  if(!draft){draft={pts:[h]};renderPlacebar();req();status();return}
  const L=draft.pts[draft.pts.length-1],P=proj(L,h);
  if(P[0]===L[0]&&P[1]===L[1]){finishWire();return}
  draft.pts.push(P);req();
}
function finishWire(){
  if(!draft)return;let pts=draft.pts;draft=null;
  pts=pts.filter((q,i)=>i===0||q[0]!==pts[i-1][0]||q[1]!==pts[i-1][1]);
  const out=[];for(const q of pts){if(out.length>=2){const a=out[out.length-2],b=out[out.length-1];if((a[0]===b[0]&&b[0]===q[0])||(a[1]===b[1]&&b[1]===q[1])){out[out.length-1]=q;continue}}out.push(q)}
  if(out.length>=2){pushUndo();S.wires.push({id:nid(),pts:out,layer:mode==='jumper'?'jumper':'solder',color:S.wireColor});S.sample=false;changed()}
  renderPlacebar();req();
}
function segDist(px,py,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],L=dx*dx+dy*dy;let t=L?((px-a[0])*dx+(py-a[1])*dy)/L:0;t=Math.max(0,Math.min(1,t));return Math.hypot(px-a[0]-t*dx,py-a[1]-t*dy)}
function hitTest(wx,wy){
  let best=null,bd=.28;
  for(const w of S.wires)for(let i=1;i<w.pts.length;i++){const d=segDist(wx,wy,w.pts[i-1],w.pts[i]);if(d<bd){bd=d;best={type:'wire',id:w.id,seg:i-1}}}
  const onHole=occ.has(K(Math.round(wx),Math.round(wy)));
  if(best&&!onHole)return best;
  let pb=null,pa=1e9;for(const p of S.parts){const[a,b,c,d]=bboxW(p);if(wx>=a&&wx<=c&&wy>=b&&wy<=d){const ar=(c-a)*(d-b);if(ar<pa){pa=ar;pb={type:'part',id:p.id}}}}
  return pb||best;
}
function changed(){rebuild();save();renderAll();req()}

let drag=null,pan=null,spaceDown=false;
function local(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
cv.addEventListener('pointerdown',e=>{
  cv.focus({preventScroll:true});const[mx,my]=local(e),w=S2W(mx,my),h=[Math.round(w[0]),Math.round(w[1])];hover=h;
  if(e.button===2)return;
  if(e.button===1||spaceDown){pan={x:mx,y:my,px:view.px,py:view.py};cv.setPointerCapture(e.pointerId);return}
  if(mode==='place'){tryPlace();return}
  if(mode==='wire'||mode==='jumper'){if(inB(...h))wireClick(h);return}
  const vt=vertexAt(w[0],w[1]);
  if(vt){sel={type:'wire',id:vt.w.id,seg:Math.max(0,Math.min(vt.i,vt.w.pts.length-2))};vdrag={id:vt.w.id,i:vt.i,orig:vt.w.pts.map(q=>q.slice()),snap:snap(),moved:false};cv.setPointerCapture(e.pointerId);tab='prop';renderPane();req();return}
  const hit=hitTest(w[0],w[1]);
  if(hit){sel=hit;tab='prop';renderPane();if(hit.type==='part'){const p=byId(hit.id);drag={id:p.id,dx:h[0]-p.x,dy:h[1]-p.y,snap:snap(),moved:false};cv.setPointerCapture(e.pointerId)}req()}
  else{if(sel){sel=null;renderPane()}pan={x:mx,y:my,px:view.px,py:view.py};cv.setPointerCapture(e.pointerId);req()}
});
cv.addEventListener('pointermove',e=>{
  const[mx,my]=local(e);
  if(pan){view.px=pan.px+mx-pan.x;view.py=pan.py+my-pan.y;req();return}
  const w=S2W(mx,my),h=[Math.round(w[0]),Math.round(w[1])];
  const ch=!hover||hover[0]!==h[0]||hover[1]!==h[1];hover=h;
  if(vdrag&&ch){const wv=S.wires.find(x=>x.id===vdrag.id);if(wv){const H=[Math.max(0,Math.min(S.cols-1,h[0])),Math.max(0,Math.min(S.rows-1,h[1]))];const np=moveVertex(vdrag.orig,vdrag.i,H);if(np.length>=2){wv.pts=np;vdrag.moved=true;rebuild()}}}
  if(drag){const p=byId(drag.id);const nx=h[0]-drag.dx,ny=h[1]-drag.dy;if(nx!==p.x||ny!==p.y){const q={...p,x:nx,y:ny};if(valid(q,p.id)){p.x=nx;p.y=ny;drag.moved=true;rebuild()}}}
  if(ch){status();req()}
});

const KO={'ㄱ':'KeyR','ㅈ':'KeyW','ㅍ':'KeyV','ㄹ':'KeyF','ㅓ':'KeyJ','ㅔ':'KeyP','ㅅ':'KeyT'};
document.addEventListener('keydown',e=>{
  if(!$('#modal').hidden){if(e.key==='Escape')closeModal();return}
  const inField=e.target.closest&&e.target.closest('input,textarea,select');
  if((e.ctrlKey||e.metaKey)&&e.code==='KeyK'){e.preventDefault();$('#q').focus();$('#q').select();return}
  if(inField)return;
  const code=KO[e.key]||e.code;
  if((e.ctrlKey||e.metaKey)&&code==='KeyZ'){e.preventDefault();e.shiftKey?redo():undo();return}
  if((e.ctrlKey||e.metaKey)&&code==='KeyY'){e.preventDefault();redo();return}
  {const combo=comboOf(e);if(combo){const ent=Object.entries(SET.colorKeys||DEFAULT_CK).find(([c,k])=>k===combo);if(ent){e.preventDefault();setWireColor(ent[0]);return}}}
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='/'){e.preventDefault();$('#q').focus();return}
  if(code==='Space'){spaceDown=true;e.preventDefault();return}
  const act={KeyR:rotate,KeyW:()=>setMode(mode==='wire'?'select':'wire'),KeyJ:()=>setMode(mode==='jumper'?'select':'jumper'),KeyV:()=>setMode('select'),KeyF:()=>setSide(!view.mirror),KeyP:togglePins,KeyT:toggleOrient,
    Escape:()=>{if(draft){draft=null;renderPlacebar();req()}else if(mode!=='select')setMode('select');else{sel=null;renderPane();req()}},
    Delete:()=>del(e.shiftKey),Backspace:()=>del(e.shiftKey),Enter:()=>{if(draft)finishWire()},NumpadEnter:()=>{if(draft)finishWire()}}[code];
  if(act){e.preventDefault();act();return}
  const m=code.match(/^(?:Digit|Numpad)([1-8])$/);if(m){const r=S.recent[+m[1]-1];if(r){e.preventDefault();startPlace(r.lib,r.value,r.params)}}
});

const DEFAULT_CK={'auto':'F1','#c9ced3':'F2','#d6453d':'F3','#2f6fd6':'F4','#e2b42a':'F5','#2b2b2b':'F6','#3a9a5b':'F7','#f4f4f4':'F8'};
const OLD_CK=['Shift+Digit1','Shift+Digit2','Shift+Digit3','Shift+Digit4','Shift+Digit5','Shift+Digit6','Shift+Digit7','Shift+Digit8'];
function comboOf(e){if(/^(Shift|Control|Alt|Meta)/.test(e.code))return null;const c=e.code==='Space'?null:e.code;if(!c)return null;return(e.ctrlKey?'Ctrl+':'')+(e.altKey?'Alt+':'')+(e.shiftKey?'Shift+':'')+c}
function comboLabel(k){if(!k)return'없음';return k.replace(/Digit(\d)/,'$1').replace(/Numpad(\d)/,'숫자패드 $1').replace(/Key([A-Z])/,'$1')}

  if(sel&&sel.type==='part'){const p=byId(sel.id);const tw=p?wiresOnPart(p):[];if(tw.length){pushUndo();tw.forEach(w=>w.color=c);changed();toast(`선 ${tw.length}개 색을 바꿨어요`);return}}

function smartResults(q){
  const out=[];const s=q.trim();if(!s)return out;
  const capish=/[pnuµμ]f?$|f$/i.test(s)||/^\d{3}$/.test(s);
  const resish=/^\d*\.?\d+\s*([kKmMrR]\d*|Ω|ohms?|옴)?$/.test(s)||/^\d+[kKmMrR]\d+$/.test(s);
  if(resish&&!/[pnuµμ]/i.test(s)){const n=parseRes(s);if(n){const v=fmtRes(n);out.push({lib:'res',value:v,name:'저항 '+v,sub:'바로 배치'});out.push({lib:'vr',value:v,name:'가변저항 '+v,sub:'3296W'})}}
  if(capish){const f=parseCap(s);if(f){const v=fmtCap(f);out.push({lib:'cer',value:v,name:'세라믹 '+v,sub:/^\d{3}$/.test(s)?s+' 표기':'바로 배치'});if(f>=1e-7)out.push({lib:'elec',value:v,name:'전해 '+v,sub:'극성'})}}
  return out;
}

function netText(k){const g=keyG.get(k);if(!g)return'<span class="nn">—</span>';
  if(g.vcc&&g.gnd)return'<span style="color:var(--bad);font-weight:600">단락</span>';if(g.vcc)return'<span class="nv">VCC</span>';if(g.gnd)return'<span class="ng">GND</span>';
  const me=occ.get(k);const others=g.pins.filter(o=>o!==me).map(o=>o.p.ref+'·'+o.q.n);
  if(!others.length)return'<span class="nn">'+(g.wires.length?'선만':'—')+'</span>';
  return esc(others.slice(0,4).join(', ')+(others.length>4?` 외 ${others.length-4}`:''))}
function checks(){
  const out=[];const v=S.vcc;
  const hasV=S.parts.some(p=>p.kind==='vcc'),hasG=S.parts.some(p=>p.kind==='gnd');
  if(!hasV)out.push(['warn','VCC 단자가 없어요. 검색창에 "vcc"를 쳐서 놓아 주세요.']);
  if(!hasG)out.push(['warn','GND 단자가 없어요. 검색창에 "gnd"를 쳐서 놓아 주세요.']);
  if(groups.some(g=>g.vcc&&g.gnd))out.push(['bad','VCC와 GND가 이어져 있어요 (단락).']);
  else if(hasV&&hasG)out.push(['ok','VCC와 GND는 분리돼 있어요.']);
  for(const p of S.parts){if(p.kind!=='ic'||ICS[p.ic].nopower)continue;const d=ICS[p.ic],pw=pinsW(p);const miss=[];
    for(const n of d.vcc){const q=pw.find(x=>x.n===n),g=keyG.get(K(q.x,q.y));if(!g||!g.vcc)miss.push(`${n}번→VCC`)}
    for(const n of d.gnd){const q=pw.find(x=>x.n===n),g=keyG.get(K(q.x,q.y));if(!g||!g.gnd)miss.push(`${n}번→GND`)}
    out.push(miss.length?['bad',`${p.ref} ${d.label} 전원핀 미연결: ${miss.join(', ')}`]:['ok',`${p.ref} ${d.label} 전원핀 연결됨`]);
    if(v<d.range[0]||v>d.range[1])out.push(['warn',`${p.ref} ${d.label} 권장 ${d.range[0]}–${d.range[1]} V 밖 (지금 ${fmtV(v)} V)`])}

function wireHoles(w){const set=new Set();if(w.layer!=='solder'){set.add(K(...w.pts[0]));set.add(K(...w.pts[w.pts.length-1]));return set}
  for(let i=1;i<w.pts.length;i++){const[a,b]=w.pts[i-1],[c,d]=w.pts[i];const n=Math.max(Math.abs(c-a),Math.abs(d-b));for(let k=0;k<=n;k++)set.add(K(a+Math.sign(c-a)*k,b+Math.sign(d-b)*k))}return set}

  let schMsg='';if(o.sch&&o.sch.text){const keep={traces:cleanTraces(o.sch.traces),tracePage:num(o.sch.tracePage,0,0,99)|0,traceFor:o.sch.traceFor==='b1'?'b1':null};o.sch.text=str(o.sch.text,30000);o.sch.name=str(o.sch.name,60);SCH.traces=keep.traces;SCH.tracePage=keep.tracePage;SCH.traceFor=keep.traceFor;applyNetText(o.sch.text,o.sch.name);schMsg=' (연결표 포함)'}
  if(o.task)o.task=cleanTask(o.task);
  if(o.task&&o.task.id&&o.task.items.length){const i=CTASKS.findIndex(t=>t.id===o.task.id);if(i>=0)CTASKS[i]=o.task;else CTASKS.push(o.task);saveTasks();S.task=o.task.id;schMsg+=(schMsg?' · ':' (')+'과제 「'+o.task.name+'」 포함'+(schMsg?'':')')}
  changed();fit();return schMsg}
function stamp(){const d=new Date(),z=n=>String(n).padStart(2,'0');return`${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}_${z(d.getHours())}${z(d.getMinutes())}`}

async function saveFile(withSch){const dl=await getDownloads();const name=`패턴도_${stamp()}.json`;const data=JSON.stringify(boardData(withSch),null,1);
  if(!dl&&typeof window.claude?.use!=='function'){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast('파일로 저장했어요');return true}catch(e){}}

  catch(e){const c=e&&e.code;if(c==='declined')return false;toast(c==='rate_limited'?'저장 창이 이미 열려 있어요':'파일로 저장하지 못했어요. "글로 복사"를 써 주세요');return false}}

R1 = 저항 27k
C1 = 전해 10u
C2 = 세라믹 0.1u
D1 = LED 빨강
Q1 = 2SC1815</pre>
  <h4>연결 줄: <code>넷이름: 번호.핀 번호.핀 …</code></h4>
  <pre>VCC: U1.8 U1.4 R1.1
GND: U1.1 C1.2 C2.2
CLK: U1.3 U4.14</pre>
  <ul><li><b>VCC</b>, <b>GND</b> 넷은 기판의 VCC·GND 단자와 맞춰 봐요.</li>
  <li>2핀 부품은 1, 2번이에요. 전해·LED는 1번이 +(애노드)예요.</li>
  <li>트랜지스터는 기판에 놓은 다리 순서대로 1·2·3이에요. 2SC1815는 E=1, C=2, B=3.</li>
  <li>연결표에 없는 핀은 <b>NC</b>(안 잇는 핀)로 봐요.</li>
  <li>저항·세라믹처럼 극성이 없는 부품은 거꾸로 꽂아도 맞다고 쳐요.</li></ul>`},
 {id:'parts',t:'부품 찾기',b:`<h3>부품 찾기 (왼쪽)</h3>
  <ul><li>검색창에 이름을 쳐요: <code>4017</code>, <code>LM358</code>, <code>트랜지스터</code>, <code>LED</code>. ${K_('/')} 또는 ${K_('Ctrl')}+${K_('K')}로 바로 검색창에 가요.</li>
  <li><b>값만</b> 쳐도 돼요: <code>10k</code>, <code>4k7</code>, <code>1M</code>은 저항, <code>100u</code>, <code>22p</code>, <code>104</code>는 콘덴서로 그 값 그대로 나와요.</li>
  <li>↑↓로 고르고 ${K_('Enter')}로 꺼내요.</li>
  <li>탭: <b>IC</b>(게이트·카운터·OP앰프 등), <b>능동</b>(다이오드·트랜지스터·LED·센서·레귤레이터), <b>수동</b>(저항·콘덴서·인덕터·크리스탈), <b>기타</b>(스위치·TP·핀헤더·전원 단자)</li>
  <li><b>최근 사용</b>: 놓았던 부품이 쌓여요. 숫자키 ${K_('1')}~${K_('8')}로 바로 꺼내요.</li></ul>
  <div class="tip">트랜지스터는 종류마다 다리 순서가 달라요(ECB, EBC, CBE). 이름 옆에 적혀 있어요.</div>`},
 {id:'place',t:'부품 놓기·옮기기',b:`<h3>부품 놓기·옮기기</h3>
  <ul><li>부품을 꺼내면 기판 위에 미리보기가 따라다녀요. 구멍을 누르면 놓여요.</li>
  <li>미리보기 점이 <b class="c-bad">빨강</b>이면 다른 핀과 겹치거나 기판 밖이에요.</li>
  <li>꺼낸 채로 ${K_('R')}로 돌려요. 그만 놓으려면 ${K_('Esc')}나 우클릭.</li>
  <li>꺼낼 때 위에 뜨는 막대에서 <b>값</b>(저항값·용량), <b>핀 간격</b>, <b>핀 수</b>(핀헤더)를 바꿀 수 있어요.</li>
  <li>놓은 부품은 끌어서 옮기고, 골라서 ${K_('R')}로 돌려요.</li>
  <li>IC 핀에는 번호와 기능(TRIG, OUT…)이 보여요. <b class="c-bad">빨강</b>은 VCC 핀, <b style="color:#2f6fd6">파랑</b>은 GND 핀이에요. 확대해야 보여요.</li></ul>`},
 {id:'wire',t:'선 그리기·고치기',b:`<h3>선 그리기·고치기</h3>
  <h4>그리기</h4>
  <ul><li>${K_('W')} <b>배선(심선)</b>: 납땜면에 깔리는 선. 지나가는 구멍의 핀과 다 이어진 걸로 쳐요.</li>
  <li>${K_('J')} <b>점퍼선</b>: 부품면 위로 넘어가는 선. 양 끝만 이어져요. 심선을 건너갈 때 써요.</li>
  <li>구멍을 차례로 눌러 꺾는 점을 찍어요. 가로·세로로만 그려져요.</li>
  <li>끝내기: 같은 점 한 번 더 · ${K_('Enter')} · 우클릭</li></ul>
  <h4>고치기</h4>
  <ul><li>선을 누르면 그 <b>구간</b>이 진하게 표시돼요. ${K_('Del')}은 그 구간만, ${K_('Shift')}+${K_('Del')}은 선 전체를 지워요.</li>
  <li>선을 고르면 꼭짓점에 하얀 네모가 생겨요. 끌면 늘이거나 줄이고, 직각은 유지돼요.</li>
  <li>색: 선을 고른 채 위쪽 색 동그라미나 ${K_('F1')}~${K_('F8')}. 부품을 고르고 누르면 그 부품에 닿은 선이 다 바뀌어요.</li></ul>`},
 {id:'view',t:'화면 움직이기',b:`<h3>화면 움직이기</h3>
  <div class="fx"><b>확대·축소</b><span>마우스 휠</span><b>이동</b><span>빈 곳을 끌기, 또는 ${K_('Space')}를 누른 채 끌기</span><b>맞춤</b><span>위쪽 <b>맞춤</b> 버튼</span><b>납땜면</b><span>${K_('F')} — 실제로 납땜할 면에서 본 모습(좌우 반전)</span><b>가로·세로</b><span>${K_('T')}</span></div>
  <div class="tip">구멍에 마우스를 올리면 그 구멍과 이어진 핀이 모두 강조되고, 회로도의 넷 이름에도 밑줄이 생겨요.</div>`},
 {id:'check',t:'맞게 이었는지 확인',b:`<h3>맞게 이었는지 확인</h3>
  <h4>회로도 색</h4>
  <div class="fx"><b class="c-ok">초록 실선</b><span>그 넷이 회로도대로 다 이어졌어요.</span><b class="c-ok">초록 점선</b><span>맞게 잇는 중이에요(아직 덜 됨).</span><b class="c-bad">빨강</b><span>다른 넷과 잘못 이어졌어요(단락 포함).</span><b class="nn">회색</b><span>아직 안 이었어요.</span></div>
  <h4>점검 탭</h4>
  <ul><li><b>회로도 대조</b>: 틀린 핀과 <b>어디에 이어야 하는지</b>를 알려 줘요. 예) <code>U1.5이 VCC 쪽에 잘못 이어졌어요 → CV: C2.1에 이어야 해요</code></li>
  <li>남은 넷과 아직 안 놓은 부품도 알려 줘요.</li>
  <li><b>기판 점검</b>: VCC·GND 단락, IC 전원핀, 권장 전압, 다른 넷 핀 위를 지나가는 심선, 안 이어진 핀(NC 제외)</li></ul>
  <div class="tip">기판의 빨간 테두리 핀에 마우스를 올리면 아래 상태줄에 <b>정답</b>이 떠요.</div>`},
 {id:'prop',t:'속성 탭',b:`<h3>속성 탭</h3>
  <ul><li><b>부품을 고르면</b>: 번호, 값(저항값·용량), 핀 간격을 바꿀 수 있어요. 핀 표에 핀마다 위치·연결·<b>정답</b>이 나와요. <b>연결선 색</b>으로 그 부품에 닿은 선 색을 한꺼번에 바꿔요.</li>
  <li><b>선을 고르면</b>: 심선↔점퍼선 바꾸기, 색, 길이(칸·mm), 구간 지우기</li>
  <li>아무것도 안 고르면 단축키 목록이 보여요.</li></ul>`},
 {id:'bom',t:'부품표·과제 만들기',b:`<h3>부품표 · 과제 만들기</h3>
  <p>과제를 고르면 필요한 부품을 몇 개 놓았는지 체크리스트로 보여 줘요. 다 놓으면 <span class="c-ok">✓</span>가 붙어요. 줄을 누르면 그 부품이 바로 꺼내져요.</p>
  <h4>내 과제 만들기</h4>
  <ul><li><b>＋ 새 과제</b>를 눌러 <b>과제 이름</b>과 <b>설명</b>을 써요.</li>
  <li>부품은 세 가지 방법으로 넣어요.<ul><li><b>지금 기판에서 가져오기</b>: 기판에 놓은 부품을 종류·값별로 세어서 넣어요.</li><li><b>연결표에서 가져오기</b>: 회로도 연결표의 부품을 넣어요.</li><li><b>＋ 부품 한 줄</b>: 직접 골라요. 저항·콘덴서는 값, 핀헤더는 핀 수도 정해요.</li></ul></li>
  <li>만든 과제는 <b>편집 · 복사 · 삭제</b>할 수 있어요. <b>과제 관리</b>에서 여러 과제를 한꺼번에 지울 수도 있어요.</li></ul>
  <div class="tip">과제는 <b>파일로 저장</b>할 때 같이 들어가요. 연결표 + 과제가 담긴 파일을 후배에게 주면, 열자마자 같은 회로도와 체크리스트가 떠요.</div>`},
 {id:'file',t:'저장·불러오기',b:`<h3>저장 · 불러오기</h3>
  <ul><li>작업은 <b>이 브라우저에 자동 저장</b>돼요. 다른 사람과는 저장되는 곳이 따로라 덮어쓰지 않아요.</li>
  <li><b>파일 → 파일로 저장</b>: 기판 + 연결표 + 지금 고른 내 과제를 <code>.json</code> 파일로 내려받아요.</li>
  <li><b>기판만 저장</b>: 연결표 없이 기판만 저장해요.</li>
  <li><b>파일 불러오기</b>: 저장한 파일을 열어요. 기판에 파일을 <b>끌어다 놓아도</b> 돼요.</li>
  <li>파일 저장이 안 되는 곳에선 <b>글로 복사·붙여넣기</b>를 써요.</li></ul>
  <div class="tip">과제 제출: 후배가 <b>파일로 저장</b>한 파일을 받아서 열면, 회로도 대조가 바로 돼서 채점하기 편해요.</div>`},
 {id:'settings',t:'설정',b:`<h3>설정</h3>
  <div class="fx"><b>기판 규격</b><span>가로·세로 구멍 수(5~150). 시험용은 28 × 62.</span>
  <b>색상 조합</b><span>깔끔, 방안지, 실물 페놀, PCB 그린, 다크 등 17가지</span>
  <b>부품 그리기</b><span>선화(단색) / 실물 색</span>
  <b>부품 테두리</b><span>색, 부품면·납땜면 선 모양(실선·점선·점), 굵기</span>
  <b>세부 색</b><span>기판, 구멍, 패드, 부품 선, 심선, 바탕, 강조색을 하나씩</span>
  <b>선 색 단축키</b><span>칸을 누르고 원하는 키를 눌러요. Backspace는 지우기.</span>
  <b>화면 밝기</b><span>시스템 / 밝게 / 어둡게</span></div>`},
 {id:'keys',t:'단축키 모음',b:`<h3>단축키 모음</h3>
  <div class="fx"><b>${K_('V')}</b><span>선택</span><b>${K_('W')}</b><span>배선(심선)</span><b>${K_('J')}</b><span>점퍼선</span><b>${K_('R')}</b><span>90° 회전</span><b>${K_('F')}</b><span>부품면 ⇄ 납땜면</span><b>${K_('T')}</b><span>가로 ⇄ 세로</span><b>${K_('P')}</b><span>핀번호</span>
  <b>${K_('Del')}</b><span>고른 부품 / 선 구간 지우기</span><b>${K_('Shift')}+${K_('Del')}</b><span>선 전체 지우기</span><b>${K_('Enter')}</b><span>선 끝내기</span><b>${K_('Esc')}</b><span>취소</span>
  <b>${K_('1')}~${K_('8')}</b><span>최근 부품</span><b>${K_('F1')}~${K_('F8')}</b><span>선 색(자동·은·빨·파·노·검·초·흰)</span><b>${K_('/')} ${K_('Ctrl')}+${K_('K')}</b><span>부품 검색</span><b>${K_('Ctrl')}+${K_('Z')} / ${K_('Y')}</b><span>되돌리기 / 다시</span><b>${K_('Space')}+끌기</b><span>화면 이동</span></div>
  <p class="note">한글 자판 상태에서도 돼요(ㄱ=R, ㅈ=W, ㅓ=J, ㄹ=F …).</p>`},
 {id:'faq',t:'자주 묻는 것',b:`<h3>자주 묻는 것</h3>
  <h4>맞게 이은 것 같은데 빨강이에요</h4><ul><li>심선이 다른 넷 핀 위를 지나가고 있지 않은지 봐요. 심선은 지나가는 구멍의 핀과 다 이어져요. 건너갈 땐 점퍼선(${K_('J')})을 써요.</li><li>스캔으로 만든 연결표면 연결표가 틀렸을 수 있어요. 원본과 비교해 <b>연결표</b>에서 고쳐요.</li></ul>
  <h4>부품을 놨는데 회로도에서 "눌러서 놓기"라고 떠요</h4><ul><li>부품 번호가 회로도와 달라서예요. 회로도의 부품 블록을 눌러 꺼내거나, 속성 탭에서 번호를 회로도와 같게 바꿔요.</li></ul>
  <h4>TP는 어디에 꽂아요?</h4><ul><li>측정할 신호선 위 아무 데나요. TP는 두 다리가 안에서 붙어 있어서, 두 다리 모두 같은 선 위에 놓아요.</li></ul>
  <h4>안 이어진 핀이 있다고 떠요</h4><ul><li>회로도에서 ✕ 표시된 핀(NC)은 빼고 세요. 나머지는 이어야 하는 핀이에요. 점검 탭에 이름이 나와요.</li></ul>
  <h4>다른 컴퓨터에서 이어서 하고 싶어요</h4><ul><li><b>파일 → 파일로 저장</b> 한 뒤, 다른 컴퓨터에서 <b>파일 불러오기</b>로 열어요.</li></ul>`},
];
function openHelp(id){const cur=HELP.find(h=>h.id===id)||HELP[0];
  openModal('도움말',`<div class="help"><nav aria-label="도움말 목차"><input id="helpQ" type="search" placeholder="도움말 검색" aria-label="도움말 검색">${HELP.map(h=>`<button data-hid="${h.id}" aria-current="${h.id===cur.id}">${esc(h.t)}</button>`).join('')}</nav><article id="helpBody">${cur.b}</article></div>`,[['닫기',closeModal,'primary']]);
  const d=$('#dlg');d.classList.add('wide');
  d.addEventListener('click',e=>{const b=e.target.closest('[data-hid]');if(b){showHelp(b.dataset.hid);return}const g=e.target.closest('[data-go]');if(g){e.preventDefault();showHelp(g.dataset.go);return}
    if(e.target.closest('[data-tourstart]')){openTour(0)}});
  $('#helpQ').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();d.querySelectorAll('[data-hid]').forEach(b=>{const h=HELP.find(x=>x.id===b.dataset.hid);b.hidden=!!q&&!(h.t+' '+h.b.replace(/<[^>]+>/g,' ')).toLowerCase().includes(q)});
    if(q){const first=HELP.find(h=>(h.t+' '+h.b.replace(/<[^>]+>/g,' ')).toLowerCase().includes(q));if(first)showHelp(first.id)}});
  function showHelp(hid){const h=HELP.find(x=>x.id===hid);if(!h)return;$('#helpBody').innerHTML=h.b;$('#helpBody').scrollTop=0;d.querySelectorAll('[data-hid]').forEach(b=>b.setAttribute('aria-current',b.dataset.hid===hid))}
}
$('#b-help').onclick=()=>openHelp('start');
document.addEventListener('click',e=>{const q=e.target.closest('[data-help]');if(q){e.preventDefault();e.stopPropagation();openHelp(q.dataset.help==='tab'?({prop:'prop',chk:'check',bom:'bom'}[tab]||'prop'):q.dataset.help)}},true);
function openModal(title,body,btns){const d=$('#dlg');const nd=d.cloneNode(false);nd.className='dlg';d.replaceWith(nd);nd.innerHTML=`<h2>${esc(title)}</h2>${body}<div class="acts"></div>`;const a=nd.querySelector('.acts');
  btns.forEach(([t,fn,cls])=>{const b=document.createElement('button');b.className='b'+(cls?' '+cls:'');b.textContent=t;b.onclick=fn;a.appendChild(b)});
  $('#modal').hidden=false;(nd.querySelector('textarea')||a.lastChild).focus()}
function closeModal(){$('#modal').hidden=true;cv.focus({preventScroll:true})}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2300)}

const HAS_CLAUDE=typeof window.claude?.use==='function';
/* ───── 회로도 패널: 원본 사진 + 연결표 + 연결 확인 ───── */
const RKEY='pattern-board-ref-v2',SCKEY='pattern-board-sch-v1',SVKEY='pattern-board-schview-v1',stEl=$('#stage');
let REF={pages:[],page:0,name:''};
let SCH={name:'',text:'',parts:[],nets:[]};
let SV={view:'check',zoom:1,min:false,h:42};
let SCHEV=null,schHover=-1,scanCtl=null;
const BUILTIN={};
function saveSch(){try{localStorage.setItem(SCKEY,JSON.stringify(SCH))}catch(e){}}
function saveSV(){try{localStorage.setItem(SVKEY,JSON.stringify(SV))}catch(e){}}
function saveRef(){try{localStorage.setItem(RKEY,JSON.stringify(REF));return true}catch(e){try{localStorage.setItem(RKEY,JSON.stringify({...REF,pages:[]}))}catch(_){}return false}}

/* 종류 이름 → 부품함 키 */
function libOf(s){const t=String(s).toLowerCase().replace(/[\s_]/g,'');

function getPix(){const src=REF.pages[REF.page];if(!src)return Promise.resolve(null);if(imgPix&&imgPix.src===src)return Promise.resolve(imgPix);

function dk(P,x,y){if(x<0||y<0||x>=P.w||y>=P.h)return 0;return P.g[y*P.w+x]}
const dkH=(P,x,y)=>dk(P,x,y)||dk(P,x,y-1)||dk(P,x,y+1),dkV=(P,x,y)=>dk(P,x,y)||dk(P,x-1,y)||dk(P,x+1,y);
function runH(P,x,y){let a=x,b=x,gap=0;for(let i=x;i>=0;i--){if(dkH(P,i,y)){a=i;gap=0}else if(++gap>3)break}gap=0;for(let i=x;i<P.w;i++){if(dkH(P,i,y)){b=i;gap=0}else if(++gap>3)break}return[a,b]}
function runV(P,x,y){let a=y,b=y,gap=0;for(let i=y;i>=0;i--){if(dkV(P,x,i)){a=i;gap=0}else if(++gap>3)break}gap=0;for(let i=y;i<P.h;i++){if(dkV(P,x,i)){b=i;gap=0}else if(++gap>3)break}return[a,b]}
function clickSeg(P,nx,ny){const px=Math.round(nx*P.w),py=Math.round(ny*P.h);let best=null,bl=0;
  for(let d=-4;d<=4;d++){const y=py+d;if(dk(P,px,y)){const[a,b]=runH(P,px,y);if(b-a>bl){bl=b-a;best=[a/P.w,y/P.h,b/P.w,y/P.h]}}
    const x=px+d;if(dk(P,x,py)){const[a,b]=runV(P,x,py);if(b-a>bl){bl=b-a;best=[x/P.w,a/P.h,x/P.w,b/P.h]}}}
  return bl>=10?best:null}
function snapSeg(P,s){if(!P||!Array.isArray(s)||s.length<4||s.some(v=>typeof v!=='number'||!isFinite(v)))return s&&s.length===4?s:null;
  let[x1,y1,x2,y2]=s.map(v=>Math.max(0,Math.min(1,v)));const W=P.w,H=P.h;
  if(Math.abs(x2-x1)*W>=Math.abs(y2-y1)*H){let xa=Math.round(Math.min(x1,x2)*W),xb=Math.round(Math.max(x1,x2)*W);const y0=Math.round((y1+y2)/2*H);let by=-1,br=0;
    for(let d=-14;d<=14;d++){const y=y0+d;let c=0;for(let x=xa;x<=xb;x++)c+=dkH(P,x,y)?1:0;const r=c/Math.max(1,xb-xa+1)-Math.abs(d)*.004;if(r>br){br=r;by=y}}
    if(br<.55)return[x1,y1,x2,y1];const[a,b]=runH(P,Math.round((xa+xb)/2),by);return[Math.max(a,xa-24)/W,by/H,Math.min(b,xb+24)/W,by/H]}
  let ya=Math.round(Math.min(y1,y2)*H),yb=Math.round(Math.max(y1,y2)*H);const x0=Math.round((x1+x2)/2*W);let bx=-1,br=0;
  for(let d=-14;d<=14;d++){const x=x0+d;let c=0;for(let y=ya;y<=yb;y++)c+=dkV(P,x,y)?1:0;const r=c/Math.max(1,yb-ya+1)-Math.abs(d)*.004;if(r>br){br=r;bx=x}}
  if(br<.55)return[x1,y1,x1,y2];const[a,b]=runV(P,bx,Math.round((ya+yb)/2));return[bx/W,Math.max(a,ya-24)/H,bx/W,Math.min(b,yb+24)/H]}

const SCAN_PROMPT=`첨부 이미지는 한국 전자기능사 실기 회로도야. 만능기판에 올라가는 부분의 넷리스트를 뽑아 줘.
규칙:
1. 굵은 테두리로 "(PCB)"라고 적힌 상자 안의 부품은 빼. 그 상자 밖(만능기판) 부품만 넣어. PCB 상자로 넘어가는 선은 무시해.
2. type은 다음 중 하나: ${Object.values(ICS).map(d=>d.label).join(', ')}, 저항, 가변저항, 세라믹, 필름, 전해, FND500, LEDBAR, LED(색 같이), GK152, PC-17T1, 슬라이드, 택트, DIP스위치, 크리스탈, TP, 부저, 모터, 핀헤더, 2SC1815, 2SA1015, 2SC945, 2N3904, 2N3906, BC547, 2N7000, TIP120, IRF540, 1N4148, 1N4001, 제너, 7805, LM317, CdS, 인덕터.
3. value에는 저항값이나 용량만 (예: 27k, 10u, 0.1u, 30p). 없으면 빈 문자열.
4. 핀은 "참조번호.핀번호". IC는 회로도에 적힌 핀 번호 그대로. 2핀 부품은 1, 2이고 전해·LED·부저는 1이 +(애노드). TP는 1만. 가변저항은 양 끝 1·3, 가운데(와이퍼) 2. FND500: e=1, d=2, 공통=3과 8, c=4, dp=5, b=6, a=7, f=9, g=10. 트랜지스터 E=1, C=2, B=3.
5. VCC에 붙은 핀은 "VCC" 넷, 접지 기호에 붙은 핀은 "GND" 넷. 다른 넷 이름은 의미가 보이면(CLK, QA 등) 그걸로, 아니면 N1, N2…
6. 번호가 없는 부품은 TP1처럼 번호를 붙여. X 표시된 핀(미연결)은 넣지 마.
7. 선이 교차만 하고 점(●)이 없으면 연결이 아니야.
8. 각 넷의 wires에는 그 넷이 회로도에 그려진 선의 위치를 적어. ${TRACE_RULE}
JSON 하나만 답해. 형식: {"parts":[{"ref":"U1","type":"NE555","value":""}],"nets":[{"name":"VCC","pins":["U1.8","U1.4"],"wires":[[0.12,0.30,0.12,0.45]]}]}`;
function d2b(u){const i=u.indexOf(',');const mime=(u.slice(5,i).split(';')[0])||'image/jpeg';const bin=atob(u.slice(i+1));const a=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)a[k]=bin.charCodeAt(k);return new Blob([a],{type:mime})}
let sampleFn;async function getSample(){if(sampleFn!==undefined)return sampleFn;if(typeof window.claude?.use!=='function')return sampleFn=null;try{sampleFn=await window.claude.use('sample')}catch(e){sampleFn=null}return sampleFn}
async function scan(){
  if(scanCtl)return;
  if(!REF.pages.length){toast('먼저 회로도 사진이나 PDF를 올려 주세요');$('#refFile').click();return}
  const sample=await getSample();if(!sample)return toast('여기서는 스캔을 쓸 수 없어요. 연결표를 직접 입력해 주세요');
  const lim=await sample.limits().catch(()=>null);if(!lim||!lim.images)return toast('이 화면에서는 사진을 보낼 수 없어요. 연결표를 직접 입력해 주세요');
  scanCtl=new AbortController();SV.min=false;renderSch();
  try{const res=await sample.json(SCAN_PROMPT,{images:[d2b(REF.pages[REF.page])],modelTier:'complex',signal:scanCtl.signal});
    const lines=['# 스캔 결과 — 원본과 꼭 비교해서 고쳐 주세요','# 부품'];
    for(const p of(res&&res.parts)||[])lines.push(`${String(p.ref||'').trim()} = ${String(p.type||'').trim()} ${String(p.value||'').trim()}`.trim());
    lines.push('','# 연결');for(const n of(res&&res.nets)||[])if(Array.isArray(n.pins)&&n.pins.length)lines.push(`${String(n.name||'N').trim()}: ${n.pins.join(' ')}`);
    const text=lines.join('\n');scanCtl=null;
    SCH.traces=await tracesFrom((res&&res.nets)||[]);SCH.tracePage=REF.page;SCH.traceFor=null;
    const r=applyNetText(text,(REF.name||'회로도')+' 스캔');
    if(!r.parts.length){renderSch();return toast('회로도에서 부품을 찾지 못했어요. 회로도가 크게 보이는 쪽으로 바꿔서 다시 해 보세요')}
    toast('연결표를 만들었어요. 원본과 비교해서 틀린 곳은 연결표에서 고쳐 주세요');
    if(r.errors.length)openEditor(r.errors);
  }catch(e){scanCtl=null;renderSch();const c=e&&e.code;
    if(c==='cancelled')return;
    toast(c==='not_granted'||c==='sampling_disabled'?'Claude 사용이 허용되지 않아 스캔할 수 없어요':c==='rate_limited'?'잠시 뒤에 다시 스캔해 주세요':c==='image_rejected'?'이 사진은 보낼 수 없어요. 다른 파일로 해 보세요':c==='invalid_json'?'읽은 결과를 해석하지 못했어요. 한 번 더 눌러 보세요':'스캔하지 못했어요. 잠시 뒤 다시 해 보세요')}
}

/* 연결표 편집 */
function openEditor(errs){
  const tpl=SCH.text||`# 부품 (참조번호 = 종류 값)
U1 = NE555
R1 = 저항 27k
C1 = 전해 10u

# 연결 (넷이름: 참조번호.핀 ...)
VCC: U1.8 U1.4 R1.1
GND: U1.1 C1.2`;
  openModal('연결표',`<p style="margin:0;font-size:12.5px;color:var(--muted)">부품은 <code>R1 = 저항 27k</code>, 연결은 <code>넷이름: U1.3 R1.2</code>처럼 한 줄씩 써요. VCC·GND 넷은 기판의 VCC·GND 단자와 맞춰 봐요. 저항·콘덴서처럼 극성 없는 2핀 부품은 방향이 바뀌어도 맞게 쳐요.</p>
    <textarea id="netTxt" spellcheck="false" aria-label="연결표" style="min-height:280px">${esc(tpl)}</textarea><p class="err" id="netErr">${errs&&errs.length?esc('확인이 필요한 곳:\n'+errs.slice(0,12).join('\n')):''}</p>`,
    [['닫기',closeModal],['적용',()=>{const t=$('#netTxt').value;const r=applyNetText(t);
      if(!r.parts.length){$('#netErr').textContent='부품 줄이 하나도 없어요. "U1 = NE555"처럼 써 주세요';return}
      if(r.errors.length){$('#netErr').textContent='적용했어요. 다만 확인이 필요한 곳이 있어요:\n'+r.errors.slice(0,12).join('\n');return}
      closeModal();toast('연결표를 적용했어요')},'primary']]);
}
function openLoad(){
  openModal('회로도 불러오기',`<div class="opt">
    <button class="b" data-ld="up"><b>회로도 사진·PDF 올리기</b><small>올린 뒤 스캔을 누르면 Claude가 읽어서 연결표를 만들어요</small></button>
    <button class="b" data-ld="ed"><b>연결표 직접 입력</b><small>부품과 연결을 글로 적어요</small></button>
    <button class="b" data-ld="clr"><b>연결표 비우기</b><small>회로도 확인을 끝내요 (올린 사진은 남아요)</small></button></div>`,[['닫기',closeModal]]);
  $('#dlg').addEventListener('click',e=>{const b=e.target.closest('[data-ld]');if(!b)return;const k=b.dataset.ld;closeModal();
    if(k==='up')$('#refFile').click();if(k==='ed')openEditor();if(k==='clr'){SCH={name:'',text:'',parts:[],nets:[]};saveSch();renderSch();req()}});
}

/* 이벤트 */
$('#b-ref').onclick=()=>$('#refFile').click();
$('#refFile').addEventListener('change',e=>{loadRefFile(e.target.files[0]);e.target.value=''});
stEl.addEventListener('dragover',e=>{if([...e.dataTransfer.types].includes('Files')){e.preventDefault();stEl.classList.add('drop')}});
stEl.addEventListener('dragleave',e=>{if(!stEl.contains(e.relatedTarget))stEl.classList.remove('drop')});
stEl.addEventListener('drop',e=>{e.preventDefault();stEl.classList.remove('drop');const f=e.dataTransfer.files[0];if(!f)return;if(/\.json$/i.test(f.name)||f.type==='application/json')loadBoardFile(f);else loadRefFile(f)});
$('#schView').addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(!b)return;SV.view=b.dataset.v;SV.min=false;saveSV();renderSch()});
$('#schIn').onclick=()=>{SV.zoom=Math.min(3,+(SV.zoom+.15).toFixed(2));saveSV();renderSch()};
$('#schOut').onclick=()=>{SV.zoom=Math.max(.4,+(SV.zoom-.15).toFixed(2));saveSV();renderSch()};
$('#schMin').onclick=()=>{SV.min=!SV.min;saveSV();renderSch()};
$('#schFlip').onclick=()=>{SV.flip=!SV.flip;saveSV();renderSch();toast(SV.flip?'회로도를 좌우로 뒤집었어요':'회로도를 원래 방향으로 돌렸어요')};
$('#schScan').onclick=scan;$('#schEdit').onclick=()=>openEditor();$('#schLoad').onclick=openLoad;
$('#schBody').addEventListener('click',e=>{
  if(e.target.id==='scanStop'){scanCtl&&scanCtl.abort();scanCtl=null;renderSch();return}
  const a=e.target.closest('[data-act2]');if(a){const k=a.dataset.act2;if(k==='upload')$('#refFile').click();if(k==='edit')openEditor();return}
  const b=e.target.closest('[data-ref]');if(b)schPartClick(b.dataset.ref)});
$('#schBody').addEventListener('change',e=>{if(e.target.id==='refSel'){REF.page=+e.target.value;saveRef();renderSch()}});
$('#schBody').addEventListener('mouseover',e=>{const t=e.target.closest('[data-net]');const i=t?+t.dataset.net:-1;if(i!==schHover){schHover=i;markNet(i);req()}});
$('#schBody').addEventListener('mouseleave',()=>{if(schHover>=0){schHover=-1;markNet(-1);req()}});
let sdrag=null;const split=$('#split');
split.addEventListener('pointerdown',e=>{sdrag=stEl.getBoundingClientRect();split.setPointerCapture(e.pointerId)});
split.addEventListener('pointermove',e=>{if(!sdrag)return;SV.h=Math.max(12,Math.min(85,Math.round((e.clientY-sdrag.top)/sdrag.height*100)));stEl.style.setProperty('--schH',SV.h+'%')});
split.addEventListener('pointerup',()=>{if(sdrag){sdrag=null;saveSV();renderSch()}});
split.addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();SV.h=Math.max(12,Math.min(85,SV.h+(e.key==='ArrowUp'?-3:3)));saveSV();renderSch()}});
let schRT;new ResizeObserver(()=>{clearTimeout(schRT);schRT=setTimeout(()=>{if(SV.view==='check'&&SCH.parts.length&&!SV.min)renderSch()},120)}).observe($('#schBody'));
try{const r=JSON.parse(localStorage.getItem(RKEY)||'null');if(r&&Array.isArray(r.pages))REF=Object.assign(REF,r)}catch(e){}
try{const r=JSON.parse(localStorage.getItem(SCKEY)||'null');if(r&&r.text){const t=str(r.text,30000),pr=parseNet(t);if(pr.parts.length)SCH={name:str(r.name,60),text:t,parts:pr.parts,nets:pr.nets,traces:cleanTraces(r.traces),tracePage:num(r.tracePage,0,0,99)|0,traceFor:r.traceFor==='b1'?'b1':null}}}catch(e){}
try{const r=JSON.parse(localStorage.getItem(SVKEY)||'null');if(r)SV=Object.assign(SV,r)}catch(e){}


/* ───── 시작 ───── */
function sample(){
  S={parts:[],wires:[],cols:28,rows:62,vcc:5.2,wireColor:'auto',task:'',recent:[],nid:1,sample:true};
  const add=(lib,val,x,y,ref)=>{const p=makePart(lib,val,null,x,y,0);p.id=nid();p.ref=ref;S.parts.push(p)};
  add('vcc',null,1,2,'VCC');add('gnd',null,1,22,'GND');
  add('ic-555',null,4,10,'U1');add('res','27kΩ',10,3,'R1');add('res','27kΩ',10,6,'R2');add('elec','10µF',10,16,'C1');add('cer','0.1µF',10,19,'C2');
  S.wires.push({id:nid(),pts:[[1,2],[1,8],[4,8],[4,10]],layer:'solder',color:'auto'});
  S.wires.push({id:nid(),pts:[[1,22],[1,14],[4,14],[4,13]],layer:'solder',color:'auto'});
  S.wires.push({id:nid(),pts:[[4,8],[9,8],[9,3],[10,3]],layer:'solder',color:'auto'});
  S.wires.push({id:nid(),pts:[[14,3],[16,3],[16,6],[14,6]],layer:'jumper',color:'#e2b42a'});
  S.recent=[{lib:'ic-555',value:'NE555',params:{}},{lib:'res',value:'27kΩ',params:{span:4}},{lib:'elec',value:'10µF',params:{span:1}},{lib:'cer',value:'0.1µF',params:{span:2}}];
}
try{const s=JSON.parse(localStorage.getItem(SKEY)||'null');if(s&&Array.isArray(s.parts)&&s.parts.every(p=>p&&LIBMAP[p.lib]))S=Object.assign(S,cleanBoard(s),{recent:cleanRecent(s.recent),wireColor:isHex(s.wireColor)?s.wireColor:'auto',sample:!!s.sample});else sample()}catch(e){sample()}
try{const v=JSON.parse(localStorage.getItem(VKEY)||'null');if(v){view.rot=v.rot??1;view.mirror=!!v.mirror;view.pins=!!v.pins}}catch(e){}
try{const c=JSON.parse(localStorage.getItem(CKEY)||'null');if(c)SET=Object.assign(SET,c)}catch(e){}
if(SET.colorKeys&&Object.values(SET.colorKeys).every((v,i)=>v===OLD_CK[i]||v===''))delete SET.colorKeys;
applyUI();
let fitted=false;
let cvTop=null,cvLeft=null;new ResizeObserver(()=>{const r=cv.getBoundingClientRect();DPR=window.devicePixelRatio||1;if(fitted&&cvTop!=null){view.py-=r.top-cvTop;view.px-=r.left-cvLeft}cvTop=r.top;cvLeft=r.left;CW=r.width;CH=r.height;cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR);if(!fitted&&CW>0){fitted=true;fit()}req()}).observe(cv);
document.fonts&&document.fonts.ready.then(req);
rebuild();renderAll();setMode('select');
{let seen=false;try{seen=!!localStorage.getItem(TKEY)}catch(e){seen=true}if(!seen)setTimeout(()=>openTour(0),400)}
})();
</script>
